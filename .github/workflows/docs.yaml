name: Build and Publish API Docs
on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - '**'
  workflow_dispatch:
jobs:
  docs:
    name: Build and Publish API Docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Conda
        run: .github/scripts/install-conda.sh
      - name: Build API Docs
        run: .github/scripts/docs.sh
      - name: Upload Pages Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.has_pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api/
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.has_pages
        id: deployment
        uses: actions/deploy-pages@v4
